<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hestia 控制台</title>
<link rel="icon" type="image/png" href="/img/logo.png?v=0.3.6">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="/img/logo.png?v=0.3.6" alt="">
    <h1>Hestia <span>控制台</span></h1>
  </header>

  <section class="card status">
    <div class="row1">
      <span class="dot" id="dot"></span>
      <span id="stateText">加载中…</span>
      <button id="btnToggle" class="btn primary">启动服务</button>
    </div>
    <div class="url" id="urlText">—</div>
    <div class="actions">
      <button id="btnOpen" class="btn">打开网页</button>
      <button id="btnLog" class="btn">查看日志</button>
    </div>
  </section>

  <section class="card">
    <h2>媒体库</h2>
    <div class="addrow">
      <input id="pathInput" placeholder="输入文件夹路径，或点「浏览」选择" spellcheck="false">
      <button id="btnBrowse" class="btn">浏览…</button>
      <button id="btnAdd" class="btn primary">添加</button>
    </div>
    <div id="libList" class="liblist"></div>
    <div class="foot">
      <button id="btnRescan" class="btn">重新扫描</button>
      <span id="statText" class="muted"></span>
    </div>
  </section>

  <section class="card">
    <h2>设置</h2>
    <div class="setrow">
      <label>端口</label>
      <input id="portInput" class="port">
      <button id="btnPort" class="btn">应用</button>
    </div>
    <div class="setrow">
      <label class="switch"><input type="checkbox" id="chkAuto"><i></i></label>
      <span>开机自启（登录后自动运行）</span>
    </div>
    <div id="ffText" class="muted small"></div>
  </section>

  <section class="card">
    <h2>软件更新</h2>
    <div class="version-row">当前版本 <strong id="currentVersion">—</strong></div>
    <div id="updateText" class="muted">点击「检查更新」查看是否有新版本</div>
    <div class="actions">
      <button id="btnCheckUpdate" class="btn">检查更新</button>
      <button id="btnInstallUpdate" class="btn primary" hidden>下载并安装（将重启）</button>
    </div>
    <div id="updateProgress" class="update-progress" hidden><span id="updateProgressFill"></span></div>
  </section>
</div>
<script src="/app.js"></script>
</body>
</html>
